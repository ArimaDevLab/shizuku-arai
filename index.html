<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>しずくの洗い流し大冒険</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 子ども向け絵本のように明るく、やさしい
   IDEA: 台所の窓から見える小さな世界を、しずくが洗い流していく
   PICTURE: 大きなゲーム画面。汚れた村→燃える森→枯れた畑→ヘドロのボス
   COLOUR and TYPE: 水色の空、若草、オレンジのアクセント / M PLUS Rounded 1c
   LAYOUT: 小さなタイトル、ゲーム画面、進行状況、操作ボタンの1カラム */
:root{color-scheme:light dark;--bg:light-dark(#e6f5fa,#0b1d29);--ink:light-dark(#123040,#e4f3f8);--card:light-dark(#ffffff,#12303f);--sub:light-dark(#4d6b7a,#9dc0cf);--water:#1f9fd6;--acc:#ff8a3d;--line:light-dark(#cfe6ee,#20475a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip}
main{max-width:760px;margin:0 auto;padding:16px max(3vw,12px) 40px}
h1{font-size:22px;line-height:1.2;margin:4px 0 10px;font-weight:800}
.screen{position:relative;border-radius:18px;overflow:hidden;background:#bfe3f2;aspect-ratio:4/3;box-shadow:0 6px 24px rgba(0,60,90,.18)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.map{display:flex;gap:6px;margin:12px 0 6px}
.map span{flex:1;text-align:center;font-size:13px;padding:6px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map span.now{border-color:var(--water);color:var(--ink);font-weight:800}
.map span.done{background:#d9f5df;color:#226b34;border-color:#a8deb4}
:root[data-theme=dark] .map span.done{background:#173d26;color:#a6e6b6;border-color:#2e6b44}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .map span.done{background:#173d26;color:#a6e6b6;border-color:#2e6b44}}
.bar{height:14px;background:var(--card);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#57c6f0,var(--water));transition:width .3s}
.stats{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-size:14px;color:var(--sub);margin:6px 0 14px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-weight:800;min-height:48px;padding:0 18px;border-radius:14px;border:0;cursor:pointer;background:var(--water);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button.on{background:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{flex:1 1 200px;min-height:60px;font-size:18px}
label{font-size:14px;color:var(--sub);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
input[type=range]{flex:1 1 140px;accent-color:var(--water);height:32px}
.meter{flex:1 1 120px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--water)}
.note{font-size:13px;color:var(--sub);margin:0}
#msg{min-height:1.4em;font-size:14px;margin:0}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<h1>しずくの洗い流し大冒険</h1>
<div class="screen"><canvas id="cv" aria-label="ゲーム画面"></canvas></div>
<div class="map" id="map"></div>
<div class="bar" aria-label="ステージの進み具合"><i id="prog"></i></div>
<div class="stats">
  <span>ステージ <b id="sname">-</b></span>
  <span>今日の洗い物 <b id="today">0分0秒</b></span>
  <span>周回 <b id="laps">0</b></span>
</div>
<div class="ctrl">
  <div class="row">
    <button class="big" id="micBtn">マイクで水の音を検知</button>
    <button class="big ghost" id="manBtn">手動：水を出してる</button>
  </div>
  <div class="row">
    <span class="note" style="flex:none">水の音</span>
    <div class="meter"><i id="lvl"></i></div>
    <span class="note" id="judge" style="flex:none;min-width:7em">-</span>
    <button class="ghost" id="calBtn" disabled>静かな音を測り直す</button>
  </div>
  <label>感度 <input type="range" id="sens" min="3" max="20" value="9"> <span id="sensV"></span></label>
  <label><input type="checkbox" id="fast" style="width:22px;height:22px"> お試し速度（5倍速）</label>
  <p id="msg" aria-live="polite"></p>
  <p class="note">マイクの音はこの端末の中だけで判定し、録音も送信もしません。手が濡れていても、画面をタップすれば手動でオン・オフできます。</p>
</div>
</main>
<script>
{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const STAGES=[
 {name:'泥だらけの村',kind:'mud',sky:['#9fd6ee','#e3f5fb'],ground:'#8fc46e',items:['house','house','house','house'],sec:120},
 {name:'燃える森',kind:'fire',sky:['#f6b27a','#fde3c4'],ground:'#7fb45c',items:['tree','tree','tree','tree'],sec:120},
 {name:'枯れた畑',kind:'dry',sky:['#a8dcf0','#f0f9e8'],ground:'#a8c46a',items:['field','field','field','field'],sec:120},
 {name:'ヘドロ沼のボス',kind:'boss',sky:['#7d93b8','#c9d6e6'],ground:'#6e9a6a',items:['boss'],sec:150}
];
const XS=[150,212,274,336];
let S={stage:0,hp:null,laps:0,day:'',todaySec:0};
try{const s=JSON.parse(localStorage.getItem('shizuku-save')||'null');if(s&&typeof s.stage==='number')S=Object.assign(S,s)}catch(e){}
const dkey=()=>new Date().toLocaleDateString('ja-JP');
if(S.day!==dkey()){S.day=dkey();S.todaySec=0}
function resetHp(){S.hp=STAGES[S.stage].items.map(()=>1)}
if(!S.hp||S.hp.length!==STAGES[S.stage].items.length)resetHp();
const save=()=>{try{localStorage.setItem('shizuku-save',JSON.stringify(S))}catch(e){}};

let W=400,H=300,dpr=1;
function size(){const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr}
const ro=new ResizeObserver(size);ro.observe(cv);

// ---- water state ----
let water=false,manual=false,micOn=false,clearT=0,parts=[],splash=[],t=0;
const GY=225;
function target(){const i=S.hp.findIndex(h=>h>0);return i}
function tpos(i){const st=STAGES[S.stage];if(st.kind==='boss')return{x:280,y:175};return{x:XS[i],y:st.kind==='dry'?GY+2:GY-38}}

// ---- drawing helpers ----
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function blob(x,y,r,c,seed){ctx.fillStyle=c;ctx.beginPath();for(let a=0;a<=12;a++){const an=a/12*Math.PI*2,rr=r*(0.8+0.2*Math.sin(an*3+seed));ctx.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr*.8)}ctx.fill()}
function house(x,h){
 ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(x-22,GY-2,48,5);
 ctx.fillStyle='#fff6e4';ctx.fillRect(x-20,GY-40,40,40);
 ctx.fillStyle='#e9dcc2';ctx.fillRect(x+8,GY-40,12,40);
 ctx.fillStyle=['#e8574a','#3e8ed0','#f0a530','#5bb36a'][XS.indexOf(x)%4];
 ctx.beginPath();ctx.moveTo(x-26,GY-38);ctx.lineTo(x,GY-62);ctx.lineTo(x+26,GY-38);ctx.fill();
 ctx.fillStyle='#8a5a3a';ctx.fillRect(x-6,GY-18,12,18);
 ctx.fillStyle='#9fd6ee';ctx.fillRect(x-16,GY-32,9,9);ctx.fillRect(x+7,GY-32,9,9);
 if(h>0){ctx.globalAlpha=Math.min(1,h*1.3);
  for(let k=0;k<5;k++)blob(x-14+k*7,GY-48+((k*17)%30),9+((k*5)%6),k%2?'#7a5232':'#8f6440',k);
  ctx.globalAlpha=1}
}
function tree(x,h){
 ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(x,GY,22,4,0,0,7);ctx.fill();
 ctx.fillStyle='#7a4f2e';ctx.fillRect(x-4,GY-30,8,30);
 const g=h>0?`rgb(${Math.round(60+90*h)},${Math.round(150-60*h)},${Math.round(70-30*h)})`:'#3f9e4d';
 circ(x,GY-46,22,g);circ(x-10,GY-36,14,g);circ(x+11,GY-38,14,g);
 circ(x-6,GY-54,8,'rgba(255,255,255,.18)');
 if(h>0){const fs=0.4+h*0.8;for(let k=0;k<3;k++){const fx=x-12+k*12,fy=GY-56+(k%2)*10,fl=Math.sin(t*10+k*2)*3;
  ctx.fillStyle='#ff6a1f';ctx.beginPath();ctx.moveTo(fx-9*fs,fy+8);ctx.quadraticCurveTo(fx-8*fs,fy-10*fs,fx+fl,fy-24*fs);ctx.quadraticCurveTo(fx+8*fs,fy-10*fs,fx+9*fs,fy+8);ctx.fill();
  ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.moveTo(fx-4*fs,fy+8);ctx.quadraticCurveTo(fx,fy-12*fs,fx+fl*.5,fy-12*fs);ctx.quadraticCurveTo(fx+4*fs,fy,fx+4*fs,fy+8);ctx.fill()}}
}
function field(x,h){
 ctx.fillStyle=h>0?'#b08a5a':'#7a5a3a';ctx.beginPath();ctx.ellipse(x,GY+4,28,9,0,0,7);ctx.fill();
 if(h>0){ctx.strokeStyle='rgba(80,50,20,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-18,GY+2);ctx.lineTo(x-6,GY+6);ctx.lineTo(x+4,GY+1);ctx.moveTo(x+6,GY+6);ctx.lineTo(x+18,GY+3);ctx.stroke()}
 const g=1-h;if(g>0.02){for(let k=0;k<3;k++){const fx=x-14+k*14,sh=26*g,sw=Math.sin(t*2+k)*2;
  ctx.strokeStyle='#3f9e4d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(fx,GY+3);ctx.quadraticCurveTo(fx+sw,GY-sh/2,fx+sw,GY-sh);ctx.stroke();
  if(g>0.5){const pr=(g-0.5)*14;const pc=['#ff6f91','#ffd23a','#9b7bff'][k];for(let a=0;a<5;a++)circ(fx+sw+Math.cos(a*1.26)*pr*.7,GY-sh+Math.sin(a*1.26)*pr*.7,pr*.5,pc);circ(fx+sw,GY-sh,pr*.35,'#fff4c2')}}}
}
function boss(h){
 const x=280,r=18+52*h,y=GY-r*.75,wob=Math.sin(t*3)*3;
 ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(x,GY,r+6,6,0,0,7);ctx.fill();
 if(h<=0){ctx.fillStyle='#ffe6f0';ctx.font='800 16px "M PLUS Rounded 1c",sans-serif';ctx.textAlign='center';ctx.fillText('ありがとう！',x,GY-50);circ(x,GY-18,16,'#9be3c2');circ(x-5,GY-21,2.5,'#123040');circ(x+5,GY-21,2.5,'#123040');return}
 ctx.fillStyle='#6b4f8f';ctx.beginPath();ctx.moveTo(x-r-wob,GY);ctx.quadraticCurveTo(x-r,y-r*.8,x,y-r*.6+wob);ctx.quadraticCurveTo(x+r,y-r*.8,x+r+wob,GY);ctx.fill();
 circ(x-r*.35,y-r*.3,r*.22,'rgba(255,255,255,.15)');
 circ(x-r*.3,y,r*.14,'#fff');circ(x+r*.3,y,r*.14,'#fff');circ(x-r*.27,y+2,r*.07,'#222');circ(x+r*.33,y+2,r*.07,'#222');
 ctx.strokeStyle='#2e1f40';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y+r*.35,r*.2,3.4,6);ctx.stroke();
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x-40,52,80,8);ctx.fillStyle='#e8574a';ctx.fillRect(x-40,52,80*h,8);
}
function hero(){
 const x=62,b=water?Math.sin(t*14)*1.5:Math.sin(t*2)*2,y=GY-26+b;
 ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(x,GY,16,4,0,0,7);ctx.fill();
 const g=ctx.createLinearGradient(x-16,y-30,x+16,y+16);g.addColorStop(0,'#8fe0ff');g.addColorStop(1,'#1f8fd0');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y-34);ctx.quadraticCurveTo(x+20,y-6,x+16,y+6);ctx.arc(x,y+6,16,0,Math.PI);ctx.quadraticCurveTo(x-20,y-6,x,y-34);ctx.fill();
 circ(x-6,y-12,4,'rgba(255,255,255,.7)');
 if(water){circ(x-5,y+2,2.6,'#0d3348');circ(x+6,y+2,2.6,'#0d3348');ctx.strokeStyle='#0d3348';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+1,y+8,4,0.2,2.9);ctx.stroke()}
 else{ctx.strokeStyle='#0d3348';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-8,y+2);ctx.lineTo(x-2,y+2);ctx.moveTo(x+3,y+2);ctx.lineTo(x+9,y+2);ctx.stroke();
  ctx.fillStyle='#ffffff';ctx.font='800 13px "M PLUS Rounded 1c",sans-serif';ctx.textAlign='left';ctx.fillText('すや…',x+12,y-30+Math.sin(t*2)*2)}
}
function scene(){
 const st=STAGES[S.stage];
 const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,st.sky[0]);g.addColorStop(1,st.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,GY);
 ctx.fillStyle='rgba(255,255,255,.55)';for(let k=0;k<3;k++){const cx=((k*150+t*6)%480)-40;circ(cx,40+k*18,14,ctx.fillStyle);circ(cx+16,36+k*18,18,ctx.fillStyle);circ(cx+34,42+k*18,12,ctx.fillStyle)}
 ctx.fillStyle='rgba(60,110,70,.35)';ctx.beginPath();ctx.moveTo(0,GY);for(let x=0;x<=W;x+=20)ctx.lineTo(x,GY-30-Math.sin(x/50+S.stage)*16);ctx.lineTo(W,GY);ctx.fill();
 ctx.fillStyle=st.kind==='boss'?'#5f7a55':st.ground;ctx.fillRect(0,GY,W,H-GY);
 ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(0,GY,W,4);
 if(st.kind==='boss'){ctx.fillStyle='rgba(107,79,143,.35)';ctx.beginPath();ctx.ellipse(280,GY+20,120*(0.3+0.7*S.hp[0]),14,0,0,7);ctx.fill()}
 st.items.forEach((it,i)=>{const h=S.hp[i];if(it==='house')house(XS[i],h);else if(it==='tree')tree(XS[i],h);else if(it==='field')field(XS[i],h);else boss(h)});
 hero();
 for(const p of parts){ctx.fillStyle=`rgba(80,190,240,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
 for(const p of splash){ctx.fillStyle=p.c||`rgba(200,240,255,${p.l*2})`;ctx.globalAlpha=Math.min(1,p.l*2);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1}
 ctx.textAlign='center';ctx.fillStyle='rgba(18,48,64,.72)';ctx.fillRect(0,H-34,W,34);
 ctx.fillStyle='#fff';ctx.font='800 15px "M PLUS Rounded 1c",sans-serif';
 ctx.fillText(clearT>0?'':(water?'じゃぶじゃぶ！ 洗い流し中':'水を出すと、しずくが動きだすよ'),W/2,H-12);
 if(clearT>0){ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(40,100,W-80,70);ctx.fillStyle='#ff8a3d';ctx.font='800 26px "M PLUS Rounded 1c",sans-serif';
  ctx.fillText(S.stage===STAGES.length-1&&S.hp.every(h=>h<=0)?'世界がきれいになった！':'ステージクリア！',W/2,140);
  ctx.fillStyle='#123040';ctx.font='800 13px "M PLUS Rounded 1c",sans-serif';ctx.fillText(st.name+' がよみがえった',W/2,160)}
}

// ---- update ----
let last=performance.now(),saveT=0;
function step(now){
 const dt=Math.min(0.1,(now-last)/1000);last=now;t+=dt;
 if(micOn)micTick(dt);
 water=manual||micState;
 const st=STAGES[S.stage],sp=$('fast').checked?5:1;
 if(clearT>0){clearT-=dt;if(clearT<=0){S.stage++;if(S.stage>=STAGES.length){S.stage=0;S.laps++}resetHp();save();ui()}}
 else if(water){
  S.todaySec+=dt;
  const i=target();
  if(i>=0){S.hp[i]-=dt*sp/(st.sec/st.items.length);
   const tp=tpos(i);
   if(Math.random()<dt*45){const T=0.55,sx=78,sy=GY-40;parts.push({x:sx,y:sy,vx:(tp.x-sx)/T+(Math.random()-.5)*20,vy:(tp.y-sy)/T-0.5*520*T,l:T,r:2+Math.random()*2.5,a:.9})}
   if(S.hp[i]<=0){S.hp[i]=0;for(let k=0;k<26;k++){const a=Math.random()*7,v=40+Math.random()*90;splash.push({x:tp.x,y:tp.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:.8,r:2+Math.random()*3,c:['#ffd23a','#7fd9ff','#ffffff','#ff8fb0'][k%4]})}
    if(target()<0){clearT=3}ui()}
  }
 }
 for(const p of parts){p.x+=p.vx*dt;p.vy+=520*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0){for(let k=0;k<3;k++)splash.push({x:p.x,y:p.y,vx:(Math.random()-.5)*80,vy:-Math.random()*80,l:.35,r:1.5+Math.random()})}}
 parts=parts.filter(p=>p.l>0);
 for(const p of splash){p.x+=p.vx*dt;p.vy+=300*dt;p.y+=p.vy*dt;p.l-=dt}
 splash=splash.filter(p=>p.l>0);
 const s=Math.min(cv.width/W,cv.height/H);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#bfe3f2';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(s,0,0,s,(cv.width-W*s)/2,(cv.height-H*s)/2);
 scene();
 saveT+=dt;if(saveT>2){saveT=0;save();stats()}
 requestAnimationFrame(step);
}
function stats(){const m=Math.floor(S.todaySec/60),sc=Math.floor(S.todaySec%60);$('today').textContent=m+'分'+sc+'秒';$('laps').textContent=S.laps}
function ui(){
 const st=STAGES[S.stage];$('sname').textContent=(S.stage+1)+'. '+st.name;
 const done=st.items.length-S.hp.reduce((a,b)=>a+b,0);$('prog').style.width=(done/st.items.length*100)+'%';
 $('map').innerHTML=STAGES.map((s,i)=>`<span class="${i<S.stage?'done':i===S.stage?'now':''}">${s.name}</span>`).join('');
 stats();
}
setInterval(()=>{const st=STAGES[S.stage];const done=st.items.length-S.hp.reduce((a,b)=>a+b,0);$('prog').style.width=(done/st.items.length*100)+'%'},500);

// ---- microphone ----
let an,buf,base=null,calib=[],micState=false,onT=0,offT=0,bandLo,bandHi;
const msg=m=>$('msg').textContent=m;
async function startMic(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();
  an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.6;ac.createMediaStreamSource(stream).connect(an);
  buf=new Float32Array(an.frequencyBinCount);const hz=ac.sampleRate/an.fftSize;bandLo=Math.round(3500/hz);bandHi=Math.min(an.frequencyBinCount,Math.round(11000/hz));midLo=Math.round(250/hz);midHi=Math.round(2000/hz);
  micOn=true;recal();$('micBtn').classList.add('on');$('micBtn').textContent='マイク検知中';$('calBtn').disabled=false;
 }catch(e){msg('この画面ではマイクが使えませんでした。下の「手動」ボタンか、ゲーム画面のタップで遊べます。');}
}
let midLo,midHi,midBase=null,calibM=[],hist=[];
function recal(){base=null;calib=[];calibM=[];hist=[];msg('静かな音を測っています…（2秒ほど水を止めてね）')}
function bandDb(lo,hi){let sum=0,lg=0,n=0;for(let i=lo;i<hi;i++){const p=Math.pow(10,buf[i]/10)+1e-12;sum+=p;lg+=Math.log(p);n++}return[10*Math.log10(sum/n),Math.exp(lg/n)/(sum/n)]}
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)]};
function micTick(dt){
 an.getFloatFrequencyData(buf);
 // 水の音：高い音域まで「シャー」と平らに広がり、音量が一定
 // 人の声：低〜中音域が強く、音の高さがあり、強弱が激しい
 const [db,flat]=bandDb(bandLo,bandHi),[mid]=bandDb(midLo,midHi);
 if(base===null){calib.push(db);calibM.push(mid);if(calib.length>90){base=med(calib);midBase=med(calibM);msg('準備OK！ 水を出してみてね')}return}
 const over=db-base,midOver=mid-midBase,thr=+$('sens').max+3-$('sens').value;
 hist.push(db);if(hist.length>45)hist.shift();
 const m=hist.reduce((a,b)=>a+b,0)/hist.length,sd=Math.sqrt(hist.reduce((a,b)=>a+(b-m)**2,0)/hist.length);
 $('lvl').style.width=Math.max(0,Math.min(100,over/(thr*2)*100))+'%';
 const loud=over>thr,steady=sd<4.5,noisy=flat>0.25,notVoice=midOver-over<8;
 const hit=loud&&steady&&noisy&&notVoice;
 $('judge').textContent=!loud?'静か':hit?'水の音':'水じゃなさそう';
 if(hit){onT+=dt;offT=0}else{offT+=dt;onT=Math.max(0,onT-dt*1.5)}
 if(!micState&&onT>1.0)micState=true;
 if(micState&&offT>1.5)micState=false;
}
function toggleManual(){manual=!manual;$('manBtn').classList.toggle('on',manual);$('manBtn').textContent=manual?'手動：水を止めた':'手動：水を出してる'}
$('micBtn').addEventListener('click',()=>{if(!micOn)startMic()});
$('manBtn').addEventListener('click',toggleManual);
cv.addEventListener('click',toggleManual);
$('calBtn').addEventListener('click',recal);
const sv=()=>{const v=+$('sens').value;$('sensV').textContent=v<8?'低':v<14?'中':'高'};
$('sens').addEventListener('input',sv);sv();
ui();requestAnimationFrame(step);
}
</script>
